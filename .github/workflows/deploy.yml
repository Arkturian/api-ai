name: Deploy AI API

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_arkturian:
        description: 'Deploy to arkturian.com'
        type: boolean
        default: true
      deploy_aiserver:
        description: 'Deploy to aiserver.oneal.eu'
        type: boolean
        default: true

jobs:
  # ============================================================================
  # Syntax gate — runs before everything. compileall on every .py file;
  # SyntaxError here MUST block the build/deploy chain. PR #56 (U+201E
  # quotes) slipped past CI because the old check used `|| echo`.
  # ============================================================================
  validate-syntax:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      # Self-hosted Runner (arkserver, Debian 12, Alex 04.09.): setup-python
      # kennt Debian nicht ("version '3.11' ... not found for Debian 12") und
      # blockierte JEDEN Deploy. Dort ist python3 = 3.11.2 = Produktion;
      # setup-python nur noch auf GitHub-gehosteten Runnern.
      - name: Setup Python (nur GitHub-hosted)
        if: ${{ !vars.RUNNER_LABEL }}
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Recursive compileall (fail on SyntaxError)
        run: python3 -m compileall -q -q .

  # ============================================================================
  # Build archive (shared by all deployments)
  # ============================================================================
  build-archive:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    needs: validate-syntax
    outputs:
      artifact-name: deploy-archive
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create deployment archive
        run: |
          echo "📦 Creating deployment archive..."
          # Archiv AUSSERHALB des Baums schreiben und tar-Exit 1 (nur
          # Warnungen: "file changed"/"file is the archive") nicht als Fehler
          # werten — auf dem self-hosted Runner (Debian 12) brach der Job
          # hier mit Exit 1 ohne Meldung ab (04.09.); Exit 2 bleibt fatal.
          tar --warning=no-file-changed --ignore-failed-read -czf "$RUNNER_TEMP/deploy.tar.gz" \
            --exclude='.git' \
            --exclude='.devops' \
            --exclude='.github' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='.venv' \
            --exclude='venv' \
            --exclude='.env' \
            --exclude='*.log' \
            . || [ "$?" -eq 1 ]
          mv "$RUNNER_TEMP/deploy.tar.gz" ./deploy.tar.gz
          echo "✅ Archive created: $(du -h deploy.tar.gz)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy-archive
          path: deploy.tar.gz

  # ============================================================================
  # PRODUCTION: arkturian.com (api-ai.arkturian.com)
  # ============================================================================
  deploy-arkturian:
    name: Deploy to arkturian.com
    needs: build-archive
    if: |
      vars.ENABLE_ARKTURIAN_DEPLOY == 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.event_name != 'workflow_dispatch' || inputs.deploy_arkturian)
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    environment:
      name: production
      url: https://api-ai.arkturian.com

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-archive.outputs.artifact-name }}

      - name: Upload archive to arkturian.com
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: "deploy.tar.gz"
          target: "/tmp/"

      - name: Guard - private DEPLOY_HOST braucht self-hosted Runner
        run: |
          case "${{ secrets.DEPLOY_HOST }}" in
            10.*|192.168.*|172.1[6-9].*|172.2[0-9].*|172.3[01].*)
              if [ -z "${{ vars.RUNNER_LABEL }}" ]; then
                echo "::error::DEPLOY_HOST ist privat (${{ secrets.DEPLOY_HOST }}), RUNNER_LABEL aber leer - SSH wuerde in einen NAT-Timeout laufen."
                exit 1
              fi ;;
          esac

      - name: Deploy to arkturian.com
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e

            DEPLOY_PATH="/var/www/api-ai.arkturian.com"
            BACKUP_DIR="/var/backups"
            BACKUP_PREFIX="api-ai"
            TIMESTAMP=$(date +%Y%m%d-%H%M%S)
            BACKUP_PATH="$BACKUP_DIR/${BACKUP_PREFIX}-${TIMESTAMP}"

            echo "🎯 Deploy to: $DEPLOY_PATH"

            if [ -d "$DEPLOY_PATH" ]; then
              echo "💾 Creating backup (code only — venv excluded, it is rebuilt on demand)..."
              mkdir -p "$BACKUP_PATH"
              rsync -a --exclude venv --exclude __pycache__ "$DEPLOY_PATH/" "$BACKUP_PATH/"
              echo "✅ Backup created: $BACKUP_PATH"
            fi

            echo "🚀 Deploying Python API..."
            mkdir -p "$DEPLOY_PATH"

            # Extract archive directly to deploy path
            tar -xzf /tmp/deploy.tar.gz -C "$DEPLOY_PATH"
            rm -f /tmp/deploy.tar.gz

            echo "🔬 Pre-restart syntax check (post-extract guard)..."
            # Defense-in-depth: even if CI compileall was bypassed, never
            # restart the service on a syntax-broken extracted tree.
            # On fail, restore backup before exiting.
            if ! python3 -m compileall -q -q -x '(^|/)(venv|\.venv|__pycache__|\.git)(/|$)' "$DEPLOY_PATH"; then
              echo "❌ compileall failed on extracted archive — rolling back"
              if [ -n "${BACKUP_PATH:-}" ] && [ -d "$BACKUP_PATH" ]; then
                rm -rf "$DEPLOY_PATH"
                cp -r "$BACKUP_PATH" "$DEPLOY_PATH"
                echo "✅ Rolled back from $BACKUP_PATH"
              fi
              exit 1
            fi

            echo "📦 Installing Python dependencies..."
            cd "$DEPLOY_PATH"

            # Use pyenv Python if available — REUSE the venv (tar overlay keeps
            # it intact); a full rebuild on every deploy took the job to multi-
            # minute/hour territory for pure code changes.
            if [ -f ~/.pyenv/versions/3.11.9/bin/python3.11 ]; then
              if [ ! -x venv/bin/python ]; then
                ~/.pyenv/versions/3.11.9/bin/python3.11 -m venv venv
              fi
              source venv/bin/activate
            fi

            # pip install only when requirements.txt actually changed
            STAMP_FILE=".deps-stamp"; [ -d venv ] && STAMP_FILE="venv/.deps-stamp"
            REQ_HASH=$(sha256sum requirements.txt | cut -d' ' -f1)
            if [ "$(cat "$STAMP_FILE" 2>/dev/null || true)" != "$REQ_HASH" ]; then
              pip install --upgrade pip
              pip install -r requirements.txt
              echo "$REQ_HASH" > "$STAMP_FILE"
            else
              echo "Dependencies unchanged — skipping pip install"
            fi

            echo "🔄 Restarting API service..."
            systemctl restart api-ai || echo "⚠️  Service restart may need manual intervention"

            # Robust health check: uvicorn workers take a few seconds to bind
            # after restart. Poll for up to ~30s before giving up.
            echo "🩺 Waiting for /health to come back up..."
            for i in $(seq 1 15); do
              if curl -fsS --max-time 5 http://127.0.0.1:8000/health > /dev/null 2>&1; then
                echo "✅ Healthy after ${i} attempt(s)"
                break
              fi
              if [ "$i" -eq 15 ]; then
                echo "❌ Service did not come up within 30s"
                systemctl status api-ai --no-pager | tail -20 || true
                exit 1
              fi
              sleep 2
            done

            echo "✅ Deployment completed successfully!"

  # PDREI entfernt (30.10.2026, Cloud): pdrei ist abgemeldet, P3 laeuft bei
  # Jascha, die alte IP ist laut #2595 an Fremde vergeben. Kein Deploy
  # dorthin; die PDREI_*-Secrets sind geloescht.

  # ============================================================================
  # O'NEAL: aiserver.oneal.eu (via arkturian.com jump host)
  # ============================================================================
  deploy-aiserver:
    name: Deploy to aiserver.oneal.eu
    needs: build-archive
    if: |
      vars.ENABLE_AISERVER_DEPLOY == 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.event_name != 'workflow_dispatch' || inputs.deploy_aiserver)
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    environment:
      name: oneal
      url: https://gsgbot.arkturian.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via arkturian.com jump host
        uses: appleboy/ssh-action@v1.0.3
        env:
          TARGET_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 10m
          envs: TARGET_SHA
          script: |
            set -euo pipefail
            echo "=== Deploying api-ai to aiserver.oneal.eu via jump host ==="
            echo "🎯 Target SHA: $TARGET_SHA"

            # SSH to aiserver and deploy via git. TARGET_SHA is forwarded
            # explicitly because the inner heredoc is single-quoted.
            ssh -o StrictHostKeyChecking=no -i ~/.ssh/oneal_aiserver gsgbot@aiserver.oneal.eu "TARGET_SHA='$TARGET_SHA' bash -s" << 'DEPLOY_SCRIPT'
            set -euo pipefail

            DEPLOY_PATH="/var/code/api-ai"

            echo "=== Updating repository (waiting for $TARGET_SHA) ==="
            cd "$DEPLOY_PATH"
            git clean -fd --exclude=venv --exclude=.env
            for i in $(seq 1 15); do
              git fetch origin --prune --quiet || true
              if git cat-file -e "${TARGET_SHA}^{commit}" 2>/dev/null; then
                echo "✓ Commit $TARGET_SHA visible after $i fetch attempt(s)"
                git checkout -f main 2>/dev/null || true
                git reset --hard "$TARGET_SHA"
                break
              fi
              if [ "$i" -eq 15 ]; then
                echo "❌ Commit $TARGET_SHA never appeared after 15 attempts (~45s)"
                exit 1
              fi
              sleep 3
            done

            echo "=== Installing dependencies ==="
            source venv/bin/activate
            pip install --upgrade pip
            pip install --no-cache-dir -r requirements.txt

            echo "=== Restarting service ==="
            sudo systemctl restart api-ai.service

            echo "=== Health check (with retry) ==="
            for i in $(seq 1 15); do
              if curl -fsS --max-time 5 http://127.0.0.1:8003/health > /dev/null 2>&1; then
                echo "✅ Healthy after ${i} attempt(s)"
                curl -s http://127.0.0.1:8003/health
                echo
                break
              fi
              if [ "$i" -eq 15 ]; then
                echo "❌ Service did not come up within 30s"
                sudo systemctl status api-ai.service --no-pager | tail -20 || true
                exit 1
              fi
              sleep 2
            done
            echo "=== Deployment complete ==="
            DEPLOY_SCRIPT

  # ============================================================================
  # SDK Regeneration (after all deployments)
  # ============================================================================
  trigger-sdk-regeneration:
    name: Trigger SDK Regeneration
    needs: [deploy-arkturian, deploy-aiserver]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      (needs.deploy-arkturian.result == 'success' || needs.deploy-aiserver.result == 'success')
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}

    steps:
      - name: Trigger TypeScript SDK regeneration
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.PAT_TOKEN }}
          repository: apopovic77/api-ai-typescript-sdk
          event-type: openapi-updated

      - name: Trigger C# SDK regeneration
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.PAT_TOKEN }}
          repository: apopovic77/api-ai-csharp-sdk
          event-type: openapi-updated

name: Dev Branch CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}

    steps:
      - uses: actions/checkout@v4

      # Self-hosted Runner (arkserver, Debian 12, Alex 04.09.): setup-python
      # kennt Debian nicht; dort System-Python 3.11.2 + eigenes venv, damit
      # nichts in die Benutzerumgebung des Runners installiert wird.
      - name: Setup Python (nur GitHub-hosted)
        if: ${{ !vars.RUNNER_LABEL }}
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip --quiet
          .venv/bin/pip install -r requirements.txt --quiet

      - name: Check Python syntax (recursive, fail on error)
        run: |
          # compileall walks the tree and fails the job on the first
          # SyntaxError. Quiet flag suppresses per-file success lines.
          # `-q -q` = only errors. No `|| echo` fallback — a syntax
          # error here MUST fail the job and block the PR.
          .venv/bin/python -m compileall -q -q .

      - name: Run basic tests
        run: |
          echo "✅ Python API - syntax check passed"
          .venv/bin/python --version
          .venv/bin/pip list | grep fastapi

      - name: Validate OpenAPI schema
        run: |
          echo "✅ FastAPI app structure validated"

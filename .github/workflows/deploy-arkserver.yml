name: Deploy to Arkserver

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate-syntax:
    runs-on: [self-hosted, Linux, arkserver]
    steps:
      - uses: actions/checkout@v4
      - name: Recursive compileall (fail on SyntaxError)
        run: |
          # Gate the deploy on Python compilability. PR #56 (U+201E
          # quotes) slipped past CI because the old check used
          # `|| echo`. compileall walks all .py and fails the job
          # on the first SyntaxError. No fallback, no swallowing.
          python3 -m compileall -q -q .

  build-archive:
    runs-on: [self-hosted, Linux, arkserver]
    needs: validate-syntax
    outputs:
      artifact-name: deploy-archive-arkserver
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Goal 21 / #3590: Prod hat kein aktuelles .git (die Kopie dort stammt von 2025). Der laufende
      # Stand reist als Datei mit; der Abgleich des Betreibers liest ihn ohne GitHub-Zugang.
      - name: Record deployed commit
        run: echo "${{ github.sha }}" > .deployed-commit

      - name: Create deployment archive
        run: |
          echo "📦 Creating deployment archive for arkserver..."
          # Archiv AUSSERHALB des Baums schreiben und tar-Exit 1 (nur
          # Warnungen: "file changed"/"file is the archive") nicht als Fehler
          # werten — auf dem self-hosted Runner (Debian 12) brach der Job
          # hier mit Exit 1 ohne Meldung ab (04.09.); Exit 2 bleibt fatal.
          tar --warning=no-file-changed --ignore-failed-read -czf "$RUNNER_TEMP/deploy.tar.gz" \
            --exclude='.git' \
            --exclude='.devops' \
            --exclude='.github' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='.venv' \
            --exclude='venv' \
            --exclude='.env' \
            --exclude='*.log' \
            . || [ "$?" -eq 1 ]
          mv "$RUNNER_TEMP/deploy.tar.gz" ./deploy.tar.gz
          echo "✅ Archive created: $(du -h deploy.tar.gz)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy-archive-arkserver
          path: deploy.tar.gz

  deploy:
    name: Deploy to arkserver
    needs: build-archive
    if: |
      vars.ENABLE_ARKSERVER_DEPLOY == 'true' &&
      github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, arkserver]
    environment:
      name: arkserver
      url: https://api-ai.arkserver.arkturian.com

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-archive.outputs.artifact-name }}

      - name: Upload archive to arkserver
        uses: appleboy/scp-action@v0.1.7
        with:
          # Self-hosted Runner LAEUFT auf arkserver: die oeffentliche IP ist
          # von innen nicht erreichbar (Router ohne Hairpin, i/o timeout
          # 04.09.), die LAN-Adresse schon — auch aus dem Docker-Container
          # der scp/ssh-Action (gemessen). Es gibt nur diesen Runner (#2642).
          host: 10.192.26.50
          username: ${{ secrets.DEPLOY_USER_ARKSERVER }}
          key: ${{ secrets.DEPLOY_SSH_KEY_ARKSERVER }}
          port: ${{ secrets.DEPLOY_PORT_ARKSERVER || 22 }}
          source: "deploy.tar.gz"
          target: "/tmp/"
          timeout: 120s


      - name: Deploy to arkserver
        uses: appleboy/ssh-action@v1.0.3
        with:
          # Self-hosted Runner LAEUFT auf arkserver: die oeffentliche IP ist
          # von innen nicht erreichbar (Router ohne Hairpin, i/o timeout
          # 04.09.), die LAN-Adresse schon — auch aus dem Docker-Container
          # der scp/ssh-Action (gemessen). Es gibt nur diesen Runner (#2642).
          host: 10.192.26.50
          username: ${{ secrets.DEPLOY_USER_ARKSERVER }}
          key: ${{ secrets.DEPLOY_SSH_KEY_ARKSERVER }}
          port: ${{ secrets.DEPLOY_PORT_ARKSERVER || 22 }}
          script: |
            set -e

            # >>> geheim_schuetzen (#3251)
            # Bis 17.11.2026 stand hier `chmod -R 755`: das machte jede .env fuer alle Login-Nutzer
            # lesbar (tools-api, deSEC-Token). Jetzt zwei Schritte:
            #   rechte_setzen <ordner>   Ordner 755, Dateien lesbar und nur fuer den Eigentuemer
            #                            schreibbar; Geheimnisdateien laesst dieser Schritt aus.
            #   geheim_schuetzen <ordner> [dienstbenutzer]
            #                            Geheimnisdateien nie fuer "andere", nie weiter als vorher
            #                            (600 bleibt 600, 644/755 werden 640). Laeuft der Dienst unter
            #                            einem anderen Benutzer als dem Eigentuemer (eventcrawler,
            #                            contentapi ...), gib ihn mit: seine Dateien bekommen dann dessen
            #                            Gruppe. Danach wird nachgeprueft; bleibt eine Datei weltlesbar,
            #                            endet der Lauf mit Fehler.
            # Kanonische Fassung: templates/devops/scripts/geheim-schuetzen.sh, Abgleich: scripts/check-template-rechte.sh
            geheim_finden() {  # <ordner> [--ausser] [find-ausdruck ...]; --ausser = alle Dateien AUSSER Geheimnissen
              _gd="$1"; shift
              _gn=""
              if [ "${1:-}" = "--ausser" ]; then _gn="!"; shift; fi
              [ $# -gt 0 ] || set -- -print
              find "$_gd" \( -name node_modules -o -name venv -o -name .venv -o -name .git -o -name __pycache__ \) -prune -o \
                -type f $_gn \( \( -name '.env' -o -name '.env.*' -o -name '*.key' -o -name '*.pem' -o -name '*token*' \
                  -o -name '*cookies*.txt' -o -name 'credentials*' -o -name 'secrets*' -o -name 'dns_clients.json' \) \
                ! -name '*.example' ! -name '*.sample' ! -name '*.template' \
                ! -name '*.py' ! -name '*.js' ! -name '*.mjs' ! -name '*.cjs' ! -name '*.ts' ! -name '*.map' \
                ! -name '*.css' ! -name '*.html' ! -name '*.md' \) "$@"
            }
            rechte_setzen() {
              [ -d "$1" ] || return 0
              find "$1" -type d -exec chmod u+rwx,go+rx,go-w {} +
              geheim_finden "$1" --ausser -exec chmod u+rw,go+r,go-w {} +
            }
            geheim_schuetzen() {
              [ -d "$1" ] || return 0
              if [ -n "${2:-}" ] && [ "$2" != root ] && id "$2" >/dev/null 2>&1; then
                geheim_finden "$1" ! -user "$2" -exec chgrp "$(id -gn "$2")" {} +
              fi
              geheim_finden "$1" -exec chmod u-x,g-wx,o-rwx {} +
              _go=$(geheim_finden "$1" -perm -004 -print)
              if [ -n "$_go" ]; then
                echo "FEHLER (#3251): Geheimnisdatei(en) weiter fuer alle lesbar:" >&2
                echo "$_go" >&2
                return 1
              fi
              echo "Geheimnisdateien geschuetzt: $1"
            }
            # <<< geheim_schuetzen

            DEPLOY_PATH="/var/www/api-ai.arkturian.com"
            BACKUP_DIR="/var/backups"
            BACKUP_PREFIX="api-ai"
            TIMESTAMP=$(date +%Y%m%d-%H%M%S)
            BACKUP_PATH="$BACKUP_DIR/${BACKUP_PREFIX}-${TIMESTAMP}"

            echo "🎯 Deploy to: $DEPLOY_PATH (arkserver)"

            if [ -d "$DEPLOY_PATH" ]; then
              echo "💾 Creating backup..."
              mkdir -p "$BACKUP_DIR"
              cp -r "$DEPLOY_PATH" "$BACKUP_PATH"
              geheim_schuetzen "$BACKUP_PATH"
              # Aufbewahrung (#3251): nur die 5 juengsten Sicherungen behalten. Bis 17.11.2026
              # sammelten sich 391 Stueck an, jede mit einer Kopie der .env. Manuelle
              # Sicherungen (api-ai-manual-*) und fremde Namen fasst das Muster nicht an.
              ls -1d "$BACKUP_DIR/${BACKUP_PREFIX}"-2[0-9][0-9][0-9][0-9][0-9][0-9][0-9]-[0-9][0-9][0-9][0-9][0-9][0-9] 2>/dev/null \
                | sort -r | tail -n +6 | tail -n 20 | while IFS= read -r alt; do
                  # Hoechstens 20 je Lauf, die aeltesten zuerst, mit niedriger IO-Prioritaet:
                  # Am 17.11. brauchte das Loeschen von 386 Sicherungen ueber 10 min, die
                  # SSH-Aktion brach ab (Run Command Timeout) und das Skript lief verwaist weiter.
                  [ "$alt" = "$BACKUP_PATH" ] && continue
                  nice -n 15 ionice -c2 -n7 rm -rf -- "$alt"
                done
              echo "✅ Backup created: $BACKUP_PATH"
            fi

            echo "🚀 Deploying Python API..."
            mkdir -p "$DEPLOY_PATH"

            # Extract archive directly to deploy path
            tar -xzf /tmp/deploy.tar.gz -C "$DEPLOY_PATH"
            rm -f /tmp/deploy.tar.gz
            # Geheimnisdateien nie fuer alle lesbar, auch nicht in der Sicherung (#3251)
            geheim_schuetzen "$DEPLOY_PATH"

            echo "🔬 Pre-restart syntax check (post-extract guard)..."
            # Defense-in-depth: even if CI compileall was bypassed, never
            # restart the service on a syntax-broken extracted tree.
            # On fail, restore backup before exiting.
            if ! python3 -m compileall -q -q -x '(^|/)(venv|\.venv|__pycache__|\.git)(/|$)' "$DEPLOY_PATH"; then
              echo "❌ compileall failed on extracted archive — rolling back"
              if [ -n "${BACKUP_PATH:-}" ] && [ -d "$BACKUP_PATH" ]; then
                rm -rf "$DEPLOY_PATH"
                cp -r "$BACKUP_PATH" "$DEPLOY_PATH"
                echo "✅ Rolled back from $BACKUP_PATH"
              fi
              exit 1
            fi

            echo "📦 Installing Python dependencies..."
            cd "$DEPLOY_PATH"
            python3 -m pip install --upgrade pip --break-system-packages || python3 -m pip install --upgrade pip
            python3 -m pip install --break-system-packages -r requirements.txt || python3 -m pip install -r requirements.txt

            echo "🔄 Restarting API service..."
            systemctl restart api-ai || echo "⚠️  Service restart may need manual intervention"

            # Robust health check: uvicorn workers take a few seconds to bind
            # after restart. Poll for up to ~30s before giving up.
            # 90s, not 30s: the service reliably reaches "Application
            # startup complete" but has needed >30s since the app grew.
            # On 2026-08-07 the run went red while the service was fine —
            # startup completed 12:18:39, the loop had already given up.
            # A deploy that reports red while succeeding is how pdrei
            # stayed dead through six releases without anyone looking.
            echo "🩺 Waiting for /health to come back up..."
            for i in $(seq 1 45); do
              if curl -fsS --max-time 5 http://127.0.0.1:8000/health > /dev/null 2>&1; then
                echo "✅ Healthy after ${i} attempt(s)"
                break
              fi
              if [ "$i" -eq 45 ]; then
                echo "❌ Service did not come up within 90s"
                systemctl status api-ai --no-pager | tail -20 || true
                exit 1
              fi
              sleep 2
            done

            echo "✅ Deployment to arkserver completed!"

      - name: Notify on success
        if: success()
        run: |
          echo "✅ Deployment to arkserver successful!"
          echo "📍 Site: https://api-ai.arkserver.arkturian.com"

      - name: Notify on failure
        if: failure()
        run: echo "❌ Deployment to arkserver failed"
